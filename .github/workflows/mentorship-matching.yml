name: Mentorship Matching

# Matches a contributor who claims an issue with a mentor from the CODEOWNERS
# of the paths the issue touches. Commands (from the assignee, or a maintainer
# for /mentor):
#   /no-mentor  opt out of matching (assignee only)
#   /mentor     (re)match a mentor, excluding the current one

on:
  issues:
    types:
      - assigned
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: mentorship-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  match-mentor:
    name: Match mentor
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' ||
      (!github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/mentor') ||
        contains(github.event.comment.body, '/no-mentor')))
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const assignee = context.payload.assignee?.login ?? issue.assignees?.[0]?.login ?? '';
            const maintainers = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const commandPattern = /\/(no-)?mentor\b/g;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });

            // The assignee's last /mentor or /no-mentor decides whether matching is on.
            let optedOut = false;
            for (const c of comments) {
              if (c.user.login !== assignee) continue;
              const cmds = [...c.body.matchAll(commandPattern)];
              if (cmds.length) optedOut = Boolean(cmds[cmds.length - 1][1]);
            }

            let action = 'skip';
            let exclude = '';
            if (!assignee) {
              // Nothing to match without a claimant.
            } else if (context.eventName === 'issues') {
              action = optedOut ? 'skip' : 'match';
            } else {
              const cmds = [...comment.body.matchAll(commandPattern)];
              const last = cmds.length ? cmds[cmds.length - 1] : null;
              const fromAssignee = comment.user.login === assignee;
              if (last && last[1] && fromAssignee) {
                action = 'opt-out';
              } else if (last && !last[1] && (fromAssignee || maintainers.includes(comment.author_association))) {
                action = 'reassign';
                // Exclude the mentor from the previous bot comment, if any.
                for (const c of comments) {
                  if (c.user.type !== 'Bot') continue;
                  const m = c.body.match(/<!-- mentorship-match: mentor=(\S+) -->/);
                  if (m && m[1] !== 'none') exclude = m[1];
                }
              }
            }

            core.setOutput('action', action);
            core.setOutput('assignee', assignee);
            core.setOutput('exclude', exclude);
            console.log(`action=${action} assignee=${assignee} exclude=${exclude}`);

      - name: Match mentor
        id: match
        if: steps.request.outputs.action == 'match' || steps.request.outputs.action == 'reassign'
        env:
          MENTOR_MATCH_TOKEN: ${{ secrets.MENTOR_MATCH_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ steps.request.outputs.assignee }}
          EXCLUDE: ${{ steps.request.outputs.exclude }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue-body.md
          python3 scripts/match-mentor.py \
            --issue-number "$ISSUE_NUMBER" \
            --issue-body-file issue-body.md \
            --assignee "$ASSIGNEE" \
            --exclude "$EXCLUDE" > match.json
          cat match.json

      - name: Post introduction
        if: steps.request.outputs.action != 'skip'
        uses: actions/github-script@v7
        env:
          ACTION: ${{ steps.request.outputs.action }}
          ASSIGNEE: ${{ steps.request.outputs.assignee }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const action = process.env.ACTION;
            const assignee = process.env.ASSIGNEE;
            const optOutHint = 'Prefer to work on your own? Comment `/no-mentor` and no further matching will happen.';

            let body;
            if (action === 'opt-out') {
              body = `Got it, @${assignee}. No mentor will be matched for this issue. Comment \`/mentor\` if you change your mind.`;
            } else {
              const match = JSON.parse(fs.readFileSync('match.json', 'utf8'));
              const scope = match.paths.length
                ? `the code this issue touches (${match.paths.map(p => `\`${p}\``).join(', ')})`
                : 'this issue';
              if (match.mentor) {
                const via = match.team ? ` from \`@${match.team}\`` : '';
                body = [
                  `<!-- mentorship-match: mentor=${match.mentor} -->`,
                  `## 🧭 Mentor match`,
                  ``,
                  `Hi @${assignee}, thanks for claiming this issue! @${match.mentor}${via} is a reviewer for ${scope} and has been matched to help you get started. Ask questions here at any time.`,
                  ``,
                  `- Not available or not a fit? Comment \`/mentor\` to get another mentor.`,
                  `- ${optOutHint}`,
                ].join('\n');
              } else {
                body = [
                  `<!-- mentorship-match: mentor=none -->`,
                  `## 🧭 Mentor match`,
                  ``,
                  `Hi @${assignee}, thanks for claiming this issue! No mentor is available right now for ${scope}` +
                    (match.reason ? ` (${match.reason})` : '') + `.`,
                  ``,
                  `- A maintainer will follow up. Comment \`/mentor\` to retry matching.`,
                  `- ${optOutHint}`,
                ].join('\n');
              }
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body,
            });
