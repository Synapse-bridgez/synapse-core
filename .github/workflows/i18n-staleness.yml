name: i18n Staleness

# Warns when a translation in docs/i18n/ no longer matches its English source
# (the source changed since the translation's source_commit). Reports only:
# it never fails the build. See "Documentation Translations" in CONTRIBUTING.md
# and docs/i18n/README.md.

on:
  push:
    branches: [ "main" ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the check diffs source_commit against HEAD.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check translation staleness
        run: python3 scripts/check-i18n-staleness.py
