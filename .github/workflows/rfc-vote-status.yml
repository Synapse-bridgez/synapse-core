name: RFC Vote Status

# Tallies maintainer reviews on RFC pull requests and keeps a single status
# comment up to date. See "Voting and consensus" in docs/rfcs/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'docs/rfcs/**'
      - 'scripts/rfc-vote-status.py'
      - '.github/workflows/rfc-vote-status.yml'
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  rfc-vote-status:
    name: Publish RFC vote and consensus status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Tally votes and update status comment
        env:
          # Needs read access to the maintainers team; GITHUB_TOKEN cannot read org team membership.
          GITHUB_TOKEN: ${{ secrets.RFC_STATUS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/rfc-vote-status.py
