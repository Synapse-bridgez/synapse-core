# Synapse Core CI/CD Workflow
#
# This workflow runs on every push to `main`/`develop` and on pull requests
# targeting `develop`. It is split into three jobs that run in sequence:
#
#   unit-tests ──┐
#                ├──► coverage
#   integration-tests ──┘
#
# ## Pagination in CI/CD
#
# Pagination logic (cursor-based, offset-based, and WebSocket streaming) is
# exercised across all three jobs:
#
# - unit-tests:       runs `--lib --bins` which includes all inline `#[cfg(test)]`
#                     modules, covering pure-logic pagination unit tests
#                     (cursor encoding/decoding, limit clamping, filter building).
#
# - integration-tests: runs `-- --ignored` which includes the full integration
#                      test suite. Pagination integration tests are gated with
#                      `#[ignore]` because they require live Postgres + Redis.
#                      The `--skip` flags exclude unrelated flaky tests so that
#                      pagination tests always run.
#
# - coverage:         collects LLVM coverage across both unit and integration
#                     test runs and enforces a minimum line-coverage threshold.
#                     Pagination code paths (cursor queries, offset queries,
#                     GraphQL pagination resolvers) must remain above the
#                     project-wide 40 % floor; the 60 % warning threshold
#                     encourages higher coverage over time.
#
# See docs/ci-cd-pagination.md for a full explanation of how pagination tests
# are structured, what each job covers, and how to add new pagination tests.

name: Rust

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    # Advisories are published against dependency versions that are already
    # merged, with no code change to trigger a push/PR run. Catch those here.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

# Cancel any in-progress run for the same branch/PR so stale sessions never
# block fresh commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 1G
  # Regex used by cargo-llvm-cov to exclude generated/test files from coverage
  # reports. Pagination test helpers in tests/ are excluded here so that only
  # production pagination code (src/) counts toward the threshold.
  COVERAGE_IGNORE_REGEX: '(^|.*/)(tests?/.*|generated/.*|\.sqlx/.*)$'
  # CI pool sizing: keep connections low to match the single-node test DB.
  # These are picked up by Config::load() via DB_MIN_CONNECTIONS / DB_MAX_CONNECTIONS.
  DB_MIN_CONNECTIONS: "2"
  DB_MAX_CONNECTIONS: "10"
  DB_IDLE_TIMEOUT_SECS: "30"
  DB_STATEMENT_TIMEOUT_MS: "30000"
  DB_LONG_RUNNING_STATEMENT_TIMEOUT_MS: "120000"

jobs:
  # ── Job 1: unit-tests ────────────────────────────────────────────────────────
  # Runs fast, stateless tests that do not require Redis.
  # Covers:
  #   - Cursor encoding / decoding (src/utils/cursor.rs)
  #   - Limit clamping and filter building (src/db/query_builder.rs)
  #   - GraphQL pagination types (src/graphql/pagination/)
  #   - Quota middleware logic (src/middleware/quota.rs)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]

    # Serialize external API calls (taiki-e install-action) to avoid GitHub API rate limits
    # Multiple concurrent requests from install-action would quickly exhaust the rate limit
    concurrency:
      group: ${{ github.workflow }}-install-tools-${{ github.ref }}
      cancel-in-progress: false

    # Limit job-level permissions to the minimum required.
    permissions:
      contents: read

    services:
      # Postgres is required even for unit tests because sqlx performs
      # compile-time query verification against a live database.
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Install sccache
      uses: taiki-e/install-action@sccache

    # Restore the sccache daemon session between runs so the compiler-cache
    # hit rate is maximised without leaking state across unrelated branches.
    - name: Start sccache session
      run: sccache --start-server || true

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.rust }}-cargo-
          ${{ runner.os }}-cargo-

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Install sqlx-cli
      uses: taiki-e/install-action@v2
      with:
        tool: sqlx-cli@0.7.4

    # Creates the restricted, non-superuser role the app actually connects as
    # (all steps below use it instead of the bootstrap `synapse` superuser).
    # `synapse` is used only here, to provision the role once per job — see
    # scripts/db-init/01-create-app-role.sql for the docker-compose equivalent.
    - name: Create restricted app DB role (NOBYPASSRLS)
      run: |
        PGPASSWORD=synapse psql -h localhost -U synapse -d synapse_test -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'synapse_app') THEN
                CREATE ROLE synapse_app WITH LOGIN PASSWORD 'synapse_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
        END
        $$;
        GRANT ALL PRIVILEGES ON DATABASE synapse_test TO synapse_app;
        GRANT ALL ON SCHEMA public TO synapse_app;
        ALTER ROLE synapse_app SET app.is_admin = 'true';
        SQL

    # Regression guard for the exact gap this workflow was fixed to catch:
    # a correctly-written RLS policy running under a role that ignores it.
    - name: Verify app role cannot bypass RLS
      run: |
        bypass=$(PGPASSWORD=synapse_app psql -h localhost -U synapse_app -d synapse_test -tA -c \
          "SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user")
        echo "synapse_app rolbypassrls=$bypass"
        if [ "$bypass" != "f" ]; then
          echo "::error::synapse_app has BYPASSRLS set — RLS policies would be silently ignored. See tests/rls_superuser_bypass_audit_test.rs."
          exit 1
        fi

    # Validates that no migration breaks existing pagination indexes.
    # The script checks for destructive operations (DROP INDEX, ALTER TABLE)
    # on columns used by cursor queries (created_at, id).
    - name: Check migration safety
      if: matrix.rust == 'stable'
      run: ./scripts/check-migration-safety.sh migrations

    # Regression guard for the safety script's own rules — see
    # scripts/test-migration-safety.sh. Runs against fixtures, not the real
    # migrations/ directory, so it exercises the script's logic independent
    # of whatever the current migration history looks like.
    - name: Test migration safety script against fixtures
      if: matrix.rust == 'stable'
      run: ./scripts/test-migration-safety.sh

    - name: Check GraphQL handler is actually wired to the schema
      if: matrix.rust == 'stable'
      run: ./scripts/check-graphql-handler-wired.sh

    # Regression guard for the class of bug documented in
    # docs/adr/007-remove-orphaned-hexagonal-and-payments-modules.md: a file
    # under src/ that was never `mod`-declared, so it silently never compiles
    # into the crate at all despite looking like finished, tested code.
    - name: Check for unreachable (never mod-declared) src/ modules
      if: matrix.rust == 'stable'
      run: ./scripts/check-unreachable-modules.sh

    - name: Run migrations
      id: run_migrations
      run: |
        for i in 1 2 3; do
          sqlx migrate run && break
          echo "Migration attempt $i/3 failed, retrying in 5 seconds..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "All migration attempts failed"; exit 1; }
        done
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
      continue-on-error: false

    - name: Handle migration failure
      if: failure() && steps.run_migrations.outcome == 'failure'
      run: |
        echo "::error::Database migration failed. Please review migration files and database state."
        echo "::error::Check logs above for specific migration errors."
        exit 1

    - name: Run clippy
      id: run_clippy
      if: matrix.rust == 'stable'
      run: |
        set -e
        echo "Running clippy linter..."
        if ! cargo clippy -- -D warnings; then
          echo "::error::Clippy found issues. Please fix linting errors."
          exit 1
        fi
        echo "Clippy checks passed"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
      continue-on-error: false

    - name: Handle clippy failure
      if: failure() && steps.run_clippy.outcome == 'failure'
      run: |
        echo "::error::Clippy linting failed. Run 'cargo clippy -- -D warnings' locally to see issues."
        exit 1

    - name: Build
      id: build_project
      run: |
        set -e
        echo "Building project..."
        if ! cargo build --verbose; then
          echo "::error::Build failed. Check compilation errors above."
          exit 1
        fi
        echo "Build completed successfully"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
      continue-on-error: false

    - name: Handle build failure
      if: failure() && steps.build_project.outcome == 'failure'
      run: |
        echo "::error::Project build failed. Review compilation errors and fix syntax/type issues."
        exit 1

    # Runs all inline unit tests (`#[cfg(test)]` modules inside src/).
    # Pagination unit tests covered here:
    #   - src/utils/cursor.rs        — cursor encode/decode round-trips
    #   - src/db/query_builder.rs    — dynamic WHERE clause construction
    #   - src/graphql/pagination/    — cursor and offset pagination types
    #   - src/middleware/quota.rs    — rate-limit logic (affects paginated endpoints)
    - name: Run unit tests
      id: run_unit_tests
      run: |
        set -e
        echo "Running unit tests..."
        if ! cargo test --lib --bins --verbose; then
          echo "::error::Unit tests failed. Check test output above for failures."
          exit 1
        fi
        echo "Unit tests passed"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
      continue-on-error: false

    - name: Handle unit test failure
      if: failure() && steps.run_unit_tests.outcome == 'failure'
      run: |
        echo "::error::Unit tests failed. Run 'cargo test --lib --bins' locally to debug."
        exit 1


  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]

    # Serialize external API calls (taiki-e install-action) to avoid GitHub API rate limits
    # This concurrency group ensures install-action calls are not made concurrently across jobs
    concurrency:
      group: ${{ github.workflow }}-install-tools-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install sccache
      uses: taiki-e/install-action@sccache

    - name: Start sccache session
      run: sccache --start-server || true

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.rust }}-cargo-
          ${{ runner.os }}-cargo-

    - name: Install sqlx-cli
      uses: taiki-e/install-action@v2
      with:
        tool: sqlx-cli@0.7.4

    - name: Create restricted app DB role (NOBYPASSRLS)
      run: |
        PGPASSWORD=synapse psql -h localhost -U synapse -d synapse_test -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'synapse_app') THEN
                CREATE ROLE synapse_app WITH LOGIN PASSWORD 'synapse_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
        END
        $$;
        GRANT ALL PRIVILEGES ON DATABASE synapse_test TO synapse_app;
        GRANT ALL ON SCHEMA public TO synapse_app;
        ALTER ROLE synapse_app SET app.is_admin = 'true';
        SQL

    - name: Run migrations
      run: |
        for i in 1 2 3; do
          sqlx migrate run && break
          echo "Migration attempt $i/3 failed, retrying in 5 seconds..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "All migration attempts failed"; exit 1; }
        done
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test

    # Runs all tests marked `#[ignore]` — these are the integration tests that
    # require live services.
    #
    # Pagination tests included:
    #   tests/integration_test.rs   — cursor pagination, empty pages, last page
    #   tests/search_test.rs        — paginated full-text search results
    #   tests/websocket_test.rs     — paginated history on WS connect
    #   tests/graphql_test.rs       — GraphQL cursor + offset pagination
    #   tests/export_test.rs        — streaming export (large paginated result)
    #
    # Skipped tests:
    #   test_api_versioning_headers — unrelated to pagination; flaky in CI
    #   test_invalid_signature_flow — auth test; no pagination dependency
    - name: Run integration tests
      id: run_integration_tests
      run: |
        set -e
        echo "Running integration tests..."
        # exactly_once_* live in tests/webhook_concurrent_delivery_test.rs and
        # get their own dedicated step below, so skip them here to avoid
        # running the (container-heavy) harness twice in one job.
        if ! cargo test --verbose -- --ignored --skip test_api_versioning_headers --skip test_invalid_signature_flow --skip exactly_once_; then
          echo "::error::Integration tests failed. Check test output for failures."
          exit 1
        fi
        echo "Integration tests passed"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
        # pg_dump refuses to dump FORCE ROW LEVEL SECURITY tables under a
        # NOBYPASSRLS role (see Config::backup_database_url) — backup_test.rs
        # needs its own, separately-privileged connection.
        BACKUP_DATABASE_URL: postgres://synapse:synapse@localhost:5432/synapse_test
        REDIS_URL: redis://localhost:6379
      continue-on-error: false

    - name: Handle integration test failure
      if: failure() && steps.run_integration_tests.outcome == 'failure'
      run: |
        echo "::error::Integration tests failed. Ensure services (postgres, redis) are running."
        echo "::error::Run 'cargo test -- --ignored' locally to debug."
        exit 1

    # `cargo test --lib --bins` (the unit-tests job) never builds tests/*.rs
    # at all, and `cargo test -- --ignored` (the step above) only *runs*
    # tests marked #[ignore] within whatever it builds — a non-ignored test
    # living only in a tests/*.rs file was invisible to both: built by
    # neither restriction, or built-but-skipped by the other. This plain,
    # unrestricted `cargo test` closes that gap by construction — it builds
    # and runs every target (lib, bins, every tests/*.rs file) with no
    # `--ignored` filter, so it exercises every non-ignored integration test
    # this repo has, including ones added after this comment was written,
    # with no per-file allowlist to keep in sync. See
    # docs/ci-test-file-coverage.md and
    # scripts/check-test-file-ci-coverage.sh (next step), which fails the
    # build if this invocation is ever narrowed back into blind spots.
    - name: Run non-ignored tests across all test binaries
      id: run_plain_tests
      run: |
        set -e
        echo "Running non-ignored tests across lib, bins, and every tests/*.rs file..."
        if ! cargo test --verbose; then
          echo "::error::Tests failed. Check test output for failures."
          exit 1
        fi
        echo "Plain test run passed"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
        BACKUP_DATABASE_URL: postgres://synapse:synapse@localhost:5432/synapse_test
        REDIS_URL: redis://localhost:6379
      continue-on-error: false

    - name: Handle plain test failure
      if: failure() && steps.run_plain_tests.outcome == 'failure'
      run: |
        echo "::error::Plain (non-ignored) test run failed. Run 'cargo test' locally to debug."
        exit 1

    - name: Check every tests/ file is reachable by some CI cargo test invocation
      run: ./scripts/check-test-file-ci-coverage.sh

    # Standing proof of the exactly-once delivery guarantee
    # (migrations/20260601000000_webhook_exactly_once_delivery.sql +
    # src/services/webhook_dispatcher.rs). Run as its own step so a
    # regression here is attributable at a glance rather than buried in the
    # broad --ignored run above. See docs/webhook-exactly-once-harness.md.
    - name: Run webhook exactly-once delivery harness
      id: run_webhook_exactly_once
      run: |
        set -e
        if ! cargo test --verbose --test webhook_concurrent_delivery_test -- --ignored --nocapture; then
          echo "::error::Webhook exactly-once delivery harness failed - the exactly-once guarantee may have regressed."
          exit 1
        fi
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
        REDIS_URL: redis://localhost:6379
      continue-on-error: false

    - name: Handle webhook exactly-once harness failure
      if: failure() && steps.run_webhook_exactly_once.outcome == 'failure'
      run: |
        echo "::error::Run 'cargo test --test webhook_concurrent_delivery_test -- --ignored' locally to debug."
        exit 1


  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - unit-tests
      - integration-tests
    # Serialize external API calls (codecov, taiki-e install-action) to reduce rate limit pressure
    # Coverage job makes multiple external API requests; running sequentially prevents rate limit errors
    concurrency:
      group: ${{ github.workflow }}-external-api-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: llvm-tools-preview

    - name: Install sccache
      uses: taiki-e/install-action@sccache

    - name: Start sccache session
      run: sccache --start-server || true

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-coverage-cargo-
          ${{ runner.os }}-cargo-

    - name: Install sqlx-cli
      uses: taiki-e/install-action@v2
      with:
        tool: sqlx-cli@0.7.4

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Create restricted app DB role (NOBYPASSRLS)
      run: |
        PGPASSWORD=synapse psql -h localhost -U synapse -d synapse_test -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'synapse_app') THEN
                CREATE ROLE synapse_app WITH LOGIN PASSWORD 'synapse_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
        END
        $$;
        GRANT ALL PRIVILEGES ON DATABASE synapse_test TO synapse_app;
        GRANT ALL ON SCHEMA public TO synapse_app;
        ALTER ROLE synapse_app SET app.is_admin = 'true';
        SQL

    - name: Run migrations
      run: |
        for i in 1 2 3; do
          sqlx migrate run && break
          echo "Migration attempt $i/3 failed, retrying in 5 seconds..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "All migration attempts failed"; exit 1; }
        done
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test

    # Three-pass coverage collection:
    #   Pass 1 (--lib --bins): unit tests — fast, no Redis needed.
    #   Pass 2 (--ignored):    integration tests requiring Postgres + Redis.
    #   Pass 3 (no filter):    non-ignored tests that live only in tests/*.rs
    #                          files — passes 1 and 2 between them miss these
    #                          the same way the unit-tests/integration-tests
    #                          jobs did (see docs/ci-test-file-coverage.md):
    #                          --lib --bins never builds tests/*.rs at all,
    #                          and --ignored skips anything not #[ignore]d
    #                          within it. Without this pass, coverage from
    #                          e.g. tests/auth_and_signature_integration_test.rs
    #                          or tests/resource_limits_active_tasks_test.rs
    #                          was silently never counted.
    #
    # All three passes contribute to the same coverage report so that
    # pagination code exercised only by integration tests (e.g. the actual
    # SQL queries) is still counted.
    #
    # The COVERAGE_IGNORE_REGEX excludes test helpers and generated files so
    # that only production pagination code affects the threshold.
    - name: Collect coverage data
      id: collect_coverage
      run: |
        set -e
        echo "Collecting code coverage data..."

        if ! cargo llvm-cov clean --workspace; then
          echo "::error::Failed to clean coverage data"
          exit 1
        fi

        if ! cargo llvm-cov --workspace --lib --bins --no-report; then
          echo "::error::Failed to collect unit test coverage"
          exit 1
        fi

        if ! cargo llvm-cov --workspace --no-report -- --ignored --skip test_api_versioning_headers --skip test_invalid_signature_flow; then
          echo "::error::Failed to collect integration test coverage"
          exit 1
        fi

        if ! cargo llvm-cov --workspace --no-report; then
          echo "::error::Failed to collect non-ignored tests/*.rs coverage"
          exit 1
        fi

        if ! cargo llvm-cov report --html --output-dir target/llvm-cov/html --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"; then
          echo "::error::Failed to generate HTML coverage report"
          exit 1
        fi
        
        if ! cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"; then
          echo "::error::Failed to generate LCOV coverage report"
          exit 1
        fi
        
        if ! cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/summary.json --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"; then
          echo "::error::Failed to generate JSON coverage summary"
          exit 1
        fi
        
        echo "Coverage data collection completed successfully"
      env:
        DATABASE_URL: postgres://synapse_app:synapse_app@localhost:5432/synapse_test
        # See the same variable in the integration-tests job — pg_dump needs
        # an RLS-bypassing connection distinct from the app's own role.
        BACKUP_DATABASE_URL: postgres://synapse:synapse@localhost:5432/synapse_test
        REDIS_URL: redis://localhost:6379
      continue-on-error: false

    - name: Handle coverage collection failure
      if: failure() && steps.collect_coverage.outcome == 'failure'
      run: |
        echo "::error::Coverage collection failed. Check cargo-llvm-cov installation and test execution."
        exit 1

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          target/llvm-cov/html/
          target/llvm-cov/lcov.info
          target/llvm-cov/summary.json
        if-no-files-found: error

    # Serialize external API upload (Codecov) to avoid overwhelming their rate limits
    # Multiple workflows uploading simultaneously would increase 429 error probability
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        files: target/llvm-cov/lcov.info
        flags: rust
        name: rust-coverage
        disable_search: true
        verbose: true

    # Enforces coverage thresholds using the JSON summary produced above.
    # jq extracts the line-coverage percentage; awk compares it to the limits.
    # Adding new pagination code without tests will cause this step to fail
    # if coverage drops below 40 %.
    - name: Enforce coverage thresholds
      id: enforce_coverage
      run: |
        set -e
        echo "Checking coverage thresholds..."
        
        if [ ! -f target/llvm-cov/summary.json ]; then
          echo "::error::Coverage summary file not found"
          exit 1
        fi
        
        coverage=$(jq -r '.data[0].totals.lines.percent' target/llvm-cov/summary.json)
        
        if [ -z "$coverage" ] || [ "$coverage" = "null" ]; then
          echo "::error::Failed to parse coverage percentage from summary"
          exit 1
        fi
        
        echo "Line coverage: ${coverage}%"

        if awk -v c="$coverage" 'BEGIN { exit !(c < 40) }'; then
          echo "::error::Coverage ${coverage}% is below the required minimum of 40%."
          exit 1
        fi

        if awk -v c="$coverage" 'BEGIN { exit !(c < 60) }'; then
          echo "::warning::Coverage ${coverage}% is below the warning threshold of 60%."
        fi
        
        echo "Coverage threshold check passed"
      continue-on-error: false

    - name: Handle coverage threshold failure
      if: failure() && steps.enforce_coverage.outcome == 'failure'
      run: |
        echo "::error::Coverage threshold enforcement failed. Increase test coverage to meet minimum requirements."
        exit 1

  # ── Job: supply-chain-audit ─────────────────────────────────────────────
  # Enforces deny.toml's [advisories]/[licenses]/[bans]/[sources] policy.
  # deny.toml existed in the repo before this job did but was never wired
  # into any workflow, so a dependency with an incompatible license or a
  # published security advisory could merge with no CI signal at all.
  #
  # Runs on every push/PR (matrix with the other jobs) *and* once daily on
  # `schedule`, because a new advisory can be published against a version
  # that is already merged, with no code change to trigger a normal run.
  # See docs/supply-chain-policy.md for how to interpret or override a
  # failure, and for what the scheduled-failure issue step below does.
  supply-chain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # only used by the scheduled-run failure step below
    # The workflow-level `env.RUSTC_WRAPPER: sccache` (see top of file)
    # applies to every job by default, but this job never installs sccache
    # — unlike unit-tests/integration-tests/coverage, it does no compiling,
    # so there's nothing to cache. `cargo deny check` still shells out to
    # `cargo metadata`, which invokes `rustc -vV` through whatever
    # RUSTC_WRAPPER is set, so without this override it fails with
    # "could not execute process `sccache ... rustc -vV` (never executed):
    # No such file or directory" — sccache is set as the wrapper but was
    # never installed in this job's runner. Unsetting it here is simpler
    # than adding an install step purely to satisfy a cache that would
    # never be used.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        id: cargo_deny
        run: cargo deny check

      # A push/PR failure is already visible as a red check on the commit/PR.
      # A scheduled-run failure has no commit or PR to surface on, so without
      # this step a newly-published advisory against an already-merged
      # dependency would fail silently until someone happened to open the
      # Actions tab.
      - name: File or update tracking issue for scheduled-run failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "cargo-deny: scheduled supply-chain audit failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled `cargo deny check` run failed, meaning a new",
              "advisory, license violation, or banned dependency was detected",
              "against an already-merged `Cargo.lock` with no associated code",
              "change.",
              "",
              `Run: ${runUrl}`,
              "",
              "See docs/supply-chain-policy.md for how to triage and, if it's",
              "a legitimate exception, how to record it in `deny.toml`.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "supply-chain",
            });
            const open = existing.data.find((i) => i.title === title);

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `New failure:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["supply-chain"],
              });
            }

  # ── Job: docker-image-security ──────────────────────────────────────────
  # Builds the production image from `dockerfile` and fails if it doesn't
  # drop root. This is a regression guard for the USER directive added in
  # `dockerfile` — see docs/deployment-notes.md — not a general image
  # scanner; it only checks the default runtime user.
  docker-image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          tags: synapse-core:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image does not run as root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' synapse-core:ci)
          echo "Image default user: '${user:-<empty>}'"
          case "$user" in
            "" | "root" | "0" | "0:0" | root:* | *:0)
              echo "::error::Production image has no non-root USER directive (or is explicitly root/UID 0). See docs/deployment-notes.md."
              exit 1
              ;;
          esac
          echo "OK: image runs as '$user', not root."
