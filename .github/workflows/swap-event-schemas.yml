name: Swap Event Schema Compatibility

on:
  pull_request:
    paths:
      - "src/swap/events/**"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject backward-incompatible schema changes
        run: cargo test --lib swap::events
