name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository secret scan
        run: bash scripts/scan-secrets.sh
