name: Compliance Evidence

# Monthly collection of SOC 2 control evidence (docs/compliance/controls.json).
# The collector exits non-zero while any control has an open finding or a
# missing evidence source; artifacts are uploaded either way so the findings
# are retained. GitHub caps artifact retention at 90 days (see FIND-RETENTION-1).
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/compliance/**"
      - "xtask/**"
      - ".github/workflows/compliance-evidence.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate control file and matrix are in sync
        run: cargo run -q -p xtask -- compliance --check-matrix docs/compliance/control-matrix.md

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect evidence
        run: cargo run -q -p xtask -- compliance --out compliance-evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence-${{ github.run_id }}
          path: compliance-evidence/
          retention-days: 90
