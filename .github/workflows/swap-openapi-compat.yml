name: Swap OpenAPI compatibility

on:
  pull_request:
    paths:
      - "docs/openapi/swap.json"
      - "scripts/check-openapi-breaking.py"

jobs:
  breaking-change-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against base branch
        run: |
          git show "origin/${{ github.base_ref }}:docs/openapi/swap.json" > /tmp/base.json || cp docs/openapi/swap.json /tmp/base.json
          python3 scripts/check-openapi-breaking.py /tmp/base.json docs/openapi/swap.json
      - name: Self-test (simulated breaking change must be caught)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          spec = json.load(open("docs/openapi/swap.json"))
          del spec["paths"]["/swap/v1/analytics"]
          json.dump(spec, open("/tmp/broken.json", "w"))
          r = subprocess.run(["python3", "scripts/check-openapi-breaking.py", "docs/openapi/swap.json", "/tmp/broken.json"])
          sys.exit(0 if r.returncode == 1 else 1)
          PY
