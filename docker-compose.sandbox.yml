# Tenant sandbox (#1527): same app image, isolated DB/Redis, synthetic liquidity.
# Usage: docker compose -f docker-compose.sandbox.yml up -d
services:
  sandbox-postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?set SANDBOX_DB_PASSWORD}
      POSTGRES_DB: synapse_sandbox
    volumes:
      - sandbox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox-app:
    image: ${SYNAPSE_IMAGE:-synapse-core:latest}
    depends_on:
      sandbox-postgres: { condition: service_healthy }
      sandbox-redis: { condition: service_healthy }
    environment:
      APP_ENV: sandbox
      SERVER_PORT: 3000
      DATABASE_URL: postgres://sandbox:${SANDBOX_DB_PASSWORD}@sandbox-postgres:5432/synapse_sandbox
      REDIS_URL: redis://sandbox-redis:6379
      # Synthetic liquidity: fixed, configurable prices; no real network settlement.
      SANDBOX_MODE: "true"
      SANDBOX_RESPONSE_LABEL: "non-production"
      SANDBOX_PRICE_USDC_XLM: ${SANDBOX_PRICE_USDC_XLM:-8.0}
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      DEFAULT_RATE_LIMIT: "60"
      WHITELIST_RATE_LIMIT: "120"
    ports:
      - "${SANDBOX_PORT:-3100}:3000"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

volumes:
  sandbox_pg:
