[workspace]

[package]
name = "synapse-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
swap-invariants = { path = "../crates/swap-invariants" }
bigdecimal = "0.3"
chrono = "0.4"
uuid = "1"

[[bin]]
name = "fuzz_swap_requests"
path = "fuzz_targets/fuzz_swap_requests.rs"
test = false
doc = false
