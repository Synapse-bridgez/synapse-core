[package]
name = "swap-invariants"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bigdecimal = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"

[[test]]
name = "swap_engine_invariants_proptest"
path = "../../tests/swap_engine_invariants_proptest.rs"

[[test]]
name = "swap_engine_mutation_check_test"
path = "../../tests/swap_engine_mutation_check_test.rs"
