# Include this file from the Prometheus rule_files configuration.
# These bounded recording series preserve the release-scorecard signals after
# source counter/histogram samples age out of raw retention.
groups:
  - name: synapse-core-long-term-scorecard
    interval: 5m
    rules:
      - record: synapse:http_5xx_error_ratio:rate5m
        expr: |
          sum(rate(http_request_duration_ms_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_ms_count[5m])), 1e-12)

      - record: synapse:http_request_duration_ms:p50_rate5m
        expr: histogram_quantile(0.50, sum by (le) (rate(http_request_duration_ms_bucket[5m])))

      - record: synapse:http_request_duration_ms:p95_rate5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket[5m])))

      - record: synapse:http_request_duration_ms:p99_rate5m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_bucket[5m])))

      - record: synapse:db_pool_saturation_ratio:avg5m
        expr: avg_over_time(db_pool_saturation_ratio[5m])

      - record: synapse:pending_queue_depth:avg5m
        expr: avg_over_time(pending_queue_depth[5m])

  - name: synapse-core-slo
    interval: 1m
    rules:
      - record: synapse:slo_availability_error_ratio:rate5m
        expr: |
          sum(rate(http_request_duration_ms_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[5m])), 1e-12)

      - record: synapse:slo_availability_error_ratio:rate30m
        expr: |
          sum(rate(http_request_duration_ms_count{status=~"5.."}[30m]))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[30m])), 1e-12)

      - record: synapse:slo_availability_error_ratio:rate1h
        expr: |
          sum(rate(http_request_duration_ms_count{status=~"5.."}[1h]))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[1h])), 1e-12)

      - record: synapse:slo_availability_error_ratio:rate6h
        expr: |
          sum(rate(http_request_duration_ms_count{status=~"5.."}[6h]))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[6h])), 1e-12)

      - record: synapse:slo_latency_error_ratio:rate5m
        expr: |
          (sum(rate(http_request_duration_ms_count{status!~"4.."}[5m])) - sum(rate(http_request_duration_ms_bucket{status!~"4..",le="1000"}[5m])))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[5m])), 1e-12)

      - record: synapse:slo_latency_error_ratio:rate30m
        expr: |
          (sum(rate(http_request_duration_ms_count{status!~"4.."}[30m])) - sum(rate(http_request_duration_ms_bucket{status!~"4..",le="1000"}[30m])))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[30m])), 1e-12)

      - record: synapse:slo_latency_error_ratio:rate1h
        expr: |
          (sum(rate(http_request_duration_ms_count{status!~"4.."}[1h])) - sum(rate(http_request_duration_ms_bucket{status!~"4..",le="1000"}[1h])))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[1h])), 1e-12)

      - record: synapse:slo_latency_error_ratio:rate6h
        expr: |
          (sum(rate(http_request_duration_ms_count{status!~"4.."}[6h])) - sum(rate(http_request_duration_ms_bucket{status!~"4..",le="1000"}[6h])))
            / clamp_min(sum(rate(http_request_duration_ms_count{status!~"4.."}[6h])), 1e-12)

      - record: synapse:slo_http_request_volume:rate1h
        expr: sum(rate(http_request_duration_ms_count{status!~"4.."}[1h]))

      - record: synapse:swap_failure_ratio:rate10m
        expr: |
          sum(rate(swap_orders_total{event="failed"}[10m]))
            / clamp_min(sum(rate(swap_orders_total{event=~"created|failed|rejected"}[10m])), 1e-12)

      - record: synapse:swap_rejection_ratio:rate10m
        expr: |
          sum(rate(swap_orders_total{event="rejected"}[10m]))
            / clamp_min(sum(rate(swap_orders_total{event=~"created|failed|rejected"}[10m])), 1e-12)
