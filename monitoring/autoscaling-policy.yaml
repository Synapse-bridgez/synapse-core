apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapse-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapse-core
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: pending_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
    - type: Pods
      pods:
        metric:
          name: db_pool_saturation_ratio
        target:
          type: AverageValue
          averageValue: "0.80"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 300
      selectPolicy: Min
---
# Prometheus adapter metric definitions for the workload-level signals already exposed by the app:
# pending_queue_depth and db_pool_saturation_ratio.
# Keep the scale-up rule higher than the scale-down threshold to avoid flapping.
# The service should scale on backlog and pool saturation before falling back to raw CPU/memory.
