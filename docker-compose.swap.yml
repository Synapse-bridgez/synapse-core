# docker-compose.swap.yml — Swap Engine Services overlay — Issue #1490
#
# Use alongside the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.swap.yml up
#
# Adds:
#   swap-migrate    — runs migrations before workers start (exits 0 on success)
#   swap-worker     — long-running fill processor
#   swap-scheduler  — scheduled maintenance jobs (partition creation, lot expiry)
#
# Secrets are injected via environment variables sourced from .env (never
# committed); see .env.example for required variables.

services:

  # ── Migration job ────────────────────────────────────────────────────────────
  # Runs once per deploy. Workers depend on this completing successfully.
  swap-migrate:
    build: .
    container_name: synapse-swap-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://synapse_app:synapse_app@postgres:5432/synapse
      RUST_LOG: info
    command: ["/app/synapse-migrate"]
    restart: "no"
    networks:
      - default

  # ── Swap worker ───────────────────────────────────────────────────────────────
  swap-worker:
    build: .
    container_name: synapse-swap-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      swap-migrate:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 3001
      DATABASE_URL: postgres://synapse_app:synapse_app@postgres:5432/synapse
      DATABASE_URL_TEMPLATE: postgres://synapse_app:{password}@postgres:5432/synapse
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ""
      VAULT_SECRET_ID: ""
      RUST_LOG: info
      # Liquidity adapters (disabled by default; set to "true" to enable)
      SDEX_ENABLED: ${SDEX_ENABLED:-false}
      AMM_ENABLED: ${AMM_ENABLED:-false}
      SDEX_BASE_URL: https://horizon-testnet.stellar.org
      AMM_BASE_URL: https://horizon-testnet.stellar.org
      SDEX_TIMEOUT_MS: "5000"
      AMM_TIMEOUT_MS: "5000"
      PROCESSOR_WORKERS: "4"
      PROCESSOR_BATCH_SIZE: "50"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["/app/synapse-core", "--mode", "swap-worker"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: on-failure
    networks:
      - default

  # ── Swap scheduler ────────────────────────────────────────────────────────────
  swap-scheduler:
    build: .
    container_name: synapse-swap-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      swap-migrate:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 3002
      DATABASE_URL: postgres://synapse_app:synapse_app@postgres:5432/synapse
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ""
      VAULT_SECRET_ID: ""
      RUST_LOG: info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["/app/synapse-core", "--mode", "scheduler"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: on-failure
    networks:
      - default

networks:
  default:
    external: true
    name: synapse-core_default
